# paper-geo configuration.
#
# Everything researcher-specific lives here. To reuse this tool, fork the repo,
# replace this file and data/identity.yaml, and empty data/sidecars/.

identity:
  name: Leshem Choshen
  # Every form your name appears in. Used to match authorship and to warn about
  # records that use a variant you did not intend.
  name_variants:
    - Leshem Choshen
    - Choshen, Leshem
    - L. Choshen
  # Misspellings that already exist in published citations and resolve to you and to
  # nobody else. Deliberately a separate list from `name_variants`, because the two are
  # consumed in opposite directions and merging them would break both:
  #
  #   name_variants are *asserted* -- they go into ORCID's also-known-as, the site's
  #   schema.org alternateName, and the Wikidata label. A misspelling asserted there
  #   states that you spell your name that way.
  #
  #   name_typos are only *matched*, and published to exactly one surface: Wikidata
  #   aliases, where an alias is a search key rather than a claim, and where common
  #   misspellings are explicitly in scope. That is what lets a reconciler holding the
  #   string "Leshem Chosen" from a 2024 citation land on Q140867203 instead of
  #   inventing a second author -- and unlike the arXiv metadata, a citation already
  #   printed in someone else's paper can never be corrected at the source.
  #
  # They are also kept out of the *matcher* that finds typos to fix (`name_match`
  # scores a near-miss on its own), because a typo listed as a known name form stops
  # being reported and the upstream record then never gets fixed.
  #
  # One test before adding a string: does it collide with a real person? `Lesham
  # Choshen` and `Leshem Chosen` are nobody. A surname-only or initials-only variant
  # usually is somebody, and belongs here never.
  name_typos:
    - Leshem Chosen      # arXiv 2410.10783, 2409.02228
    - Lesham Choshen
  orcid: 0000-0002-0085-6496
  # The one URL that goes in ORCID, Semantic Scholar, arXiv, LinkedIn and every
  # JSON-LD sameAs. Pick one and never change it.
  canonical_url: https://borgr.github.io
  # A second personal page is fine as long as it is declared to be the same person.
  # Listed in the site's sameAs and in ORCID alongside the canonical URL, so the two
  # fuse instead of competing as separate candidate homepages.
  other_pages:
    - https://ktilana.wixsite.com/leshem-choshen
  # For ORCID's Keywords field and Google Scholar's five interest slots -- both are
  # real, linked, searchable facets. Derived from what the corpus is actually about,
  # ordered by weight in it. Multi-word: `model merging` is a query someone types,
  # `merging` is not. No coined names -- those are in the papers' own `aliases`.
  keywords:
    - natural language processing
    - self-improving AI
    - AI interaction
    - AI and humanity
    - evaluation of language models
    - model merging
    - benchmark reliability
    - language model pretraining
    - human feedback
    - language acquisition
    - efficient pretraining
    - machine translation evaluation
    - efficient evaluation
  email: leshem.choshen@weizmann.ac.il
  # schema.org Person.image. A path is resolved against `site.base_url`; a full URL is
  # used as given. Self-hosted from `static/` on purpose -- the hand-written page this
  # replaced pointed at a static.wixstatic.com URL, which is a third party's CDN path
  # for a photo on a site builder and rots when the site is re-themed. The value here
  # is that same photo, downscaled to 800px.
  #
  # A weak signal on its own -- it is one of the things a knowledge panel can show, not
  # something that makes one appear. Listed because the cost is a 58 KB file.
  image: portrait.jpg
  job_title: PI
  # Each entry is either a bare name or `{name, url, ror, wikidata}`. The bare form is a
  # string a disambiguator has to guess at -- "IBM Research" is thousands of people --
  # while the identifiers make it an entity other databases can join on instead of
  # string-matching. `ror` is the id Crossref, DataCite and OpenAlex use for
  # institutions; `wikidata` is what lets the affiliation resolve to the same node your
  # own P108 statement points at.
  #
  # Every value below is read off the organisation's own Wikidata record (P856 for the
  # site, P6782 for the ROR id), not guessed -- a wrong identifier asserts a
  # relationship to the wrong organisation, which is worse than a bare name. Two of the
  # three have no ROR id to state: ROR registers legal entities and campuses, so it has
  # `IBM (United States)` and `IBM Research - Thomas J. Watson Research Center` but no
  # record for the research division or for the joint lab. Leaving `ror` out says
  # nothing; pointing it at either of those would say something false.
  #
  # Ordered with the current employer first, which is also the order the byline reads in.
  affiliations:
    - name: Weizmann Institute of Science
      url: https://www.weizmann.ac.il/
      ror: 0316ej306
      wikidata: Q4182
    - name: MIT-IBM Watson AI Lab
      url: https://mitibmwatsonailab.mit.edu/
      wikidata: Q117720866
    - name: IBM Research
      url: https://research.ibm.com/
      wikidata: Q3146518
    # Your own lab goes here too, if it has a page. The reason it is safe -- where a
    # second *personal* page is not -- is that a lab is a different entity: two pages
    # about you compete to be the answer to "who is Leshem Choshen" and split the
    # signal between them, while a lab page answers "what is this group" and links to
    # you. The pair only works if the link is reciprocal, so add `site.base_url` to the
    # lab's people page at the same time; a one-way link from your site to the lab
    # states nothing about the lab's view of you.
    #
    # A lab almost never has a ROR id or a Wikidata item, and inventing either is the
    # failure this whole block is about, so `name` and `url` is the whole entry:
    # - name: <lab name>
    #   url: <lab url>
  # Degree-granting study only. This is the line Wikidata's `educated at` (P69) draws
  # and it is not where most people draw it: a *postdoc is employment*, not education.
  # You were not enrolled, no degree was awarded, and the institution was paying you --
  # so it belongs in `affiliations` above (P108 employer, qualified with P39 position
  # held = postdoctoral researcher), and putting it in P69 states something false about
  # a degree you did not receive. The rule is simply: was a degree awarded?
  #
  # `degree` is optional and goes in as a P512 qualifier on the P69 statement. Worth
  # filling: the institution alone says where, and the qualifier is what makes the
  # statement answer "who has a PhD in this field from there".
  education:
    - institution: Hebrew University of Jerusalem
      degree: PhD
    # Add earlier degrees if you want the full record; they cost one statement each
    # and they help disambiguation against a namesake more than a later one does,
    # because early-career papers carry that affiliation.

ids:
  # Two records today: the split that halves author-level retrieval. Keep both
  # listed until the merge lands, so the collector sees the whole corpus.
  semantic_scholar: ["41019330", "2283849613"]
  semantic_scholar_primary: "41019330"
  openalex: ["A5040286212"]
  openalex_duplicates: ["A5139793343", "A5126704705", "A5123980057", "A5134416019"]
  google_scholar: 8b8IhUYAAAAJ
  dblp: Leshem Choshen
  # dblp's *author id* is the numeric pid path, not the name. `Leshem_Choshen` is what
  # a Wikidata P2456 statement flags as a constraint violation: the property's format
  # is `NNN/NNNN` and its formatter URL is dblp.org/pid/$1, so a name-shaped value
  # builds a URL that 404s. Find yours by opening your dblp author page and reading
  # the number out of the URL, or `curl 'https://dblp.org/search/author/api?q=<name>&format=json'`.
  dblp_pid: 218/5237
  github: borgr
  huggingface: borgr          # note: the `leshem` HF account is a stub, not this one
  wikidata: Q140867203             # created by hand 2026-08-04; see tasks/wikidata_manual.md
  linkedin: leshemchoshen
  # Worth one look: OpenReview's API is bot-challenged, so this cannot be verified
  # from here, and the trailing digit is the duplicate counter -- a second profile
  # would make you ~Leshem_Choshen2 and this a link to a stranger's record.
  # Open <https://openreview.net/profile?id=~Leshem_Choshen1> once and confirm.
  openreview: ~Leshem_Choshen1
  # Social handles. These are published as typed Wikidata properties and as rel="me"
  # links on the site, so they do one job: make "the account that posts about this
  # work" and "the author of this work" the same entity to a machine, instead of a
  # guess from a display name. Fill in only accounts you control and post research
  # from -- a handle published as a Wikidata statement is an assertion that this
  # person speaks for your papers, so a guess is worse than a blank.
  # Formats: bluesky = full handle (`name.bsky.social`); mastodon = `@user@server`;
  # twitter = username without the @.
  bluesky: null
  # Verified against the instance API before being written here, per the rule above:
  # display name "Leshem Choshen", 1073 posts, created 2022-11-05. Recovered from the
  # hand-written index.html that the first --deploy replaced, which listed it in its
  # sameAs; the generated page had dropped it.
  mastodon: "@LChoshen@sigmoid.social"
  # Read off your own ORCID researcher-urls ("Twitter: twitter.com/LChoshen"), not
  # guessed from your name -- a guessed handle is a link to a stranger.
  twitter: LChoshen
  # Only fill these if the id exists -- neither is worth creating an account for.
  # Scopus indexes little arXiv/ACL work, and WoS ResearcherID is now Publons/
  # Web of Science. They are here because if you *do* have one, the typed property
  # is free and it is another edge into your ORCID.
  scopus: null
  researcherid: null

sources:
  # The bibliography stays authoritative in its own repo; we only read it.
  # orig.bib, not enhanced.bib: enhanced.bib is a snapshot of that repo's
  # build_bib.py output from when it wrote there instead of overleaf/Wzmn.bib.
  # Nothing regenerates it, so it silently drifts -- it was 8 papers and one
  # damaged title behind when we noticed. orig.bib is the curated file that
  # repo's own resolve_arxiv.py keeps current.
  bibtex_url: https://raw.githubusercontent.com/borgr/publications/master/orig.bib
  acl_anthology_person: https://aclanthology.org/people/leshem-choshen/
  # Optional: local checkout of borgr/publications. When set, `update.py --refresh-bib`
  # runs that repo's own update.py first (refreshing Scholar counts and re-resolving
  # arXiv -> published BibTeX) and reads the bib from disk instead of over HTTP.
  # One source of truth per fact: publications owns the bibliography, we only consume it.
  publications_path: null

llm:
  # Used by scripts/propose_topics.py for repo topics/descriptions and sidecar drafts.
  # Two modes:
  #   skill (default) - emits build/llm_tasks.json for an agent session to fill in.
  #                     No API key needed. Use interactively or via the paper-geo skill.
  #   api             - calls the Anthropic API directly. Needed for unattended reruns
  #                     (cron); requires ANTHROPIC_API_KEY or an `ant auth login` profile.
  mode: skill
  model: claude-opus-5
  effort: medium

collaboration:
  # Who owns each paper's canonical page. Exactly one owner per paper: duplicating
  # a canonical page splits authority and can trip Scholar's duplicate-title drop,
  # while duplicating the *pointer* to it is pure gain. See docs/COLLAB.md.
  #
  # `me` is the identity that claims ownership in our own published manifest.
  me: borgr
  # Peers running paper-geo (or just publishing a manifest). Each URL is fetched
  # on every run; a paper claimed by a peer switches to link-only mode locally.
  # Order is the tie-break when two peers claim the same paper -- but a genuine
  # conflict is flagged for a human, never silently resolved.
  peers: []
  #  - https://example.github.io/paper-geo.json
  # Default suggestion when nobody has claimed a paper yet. Advisory only.
  default_owner_rule: first_author

site:
  repo: borgr/borgr.github.io
  base_url: https://borgr.github.io
  papers_path: /papers
  # Written into every generated page; ar5iv covers pre-2024 arXiv papers that
  # have no LaTeXML HTML rendering.
  ar5iv_fallback: true
  # Search Console and Bing Webmaster Tools ownership tokens. Both are the `content`
  # value of the HTML-tag verification option, which is the one to prefer: it is
  # generated into every page, so there is nothing to keep alive by hand.
  #
  # If a service only offers file verification, put the file in `static/` -- copied
  # into the site on every build. Do not upload it to the Pages repo directly:
  # --deploy empties that repo before copying build/site into it, which is how
  # `googlea3fc3aa9969d1cda.html` was deleted by the first deploy after it was added
  # (now restored, from static/). A lapse like that surfaces weeks later as an
  # un-verified property, with nothing pointing back at the cause.
  #
  # These two consoles are the only free way to see crawled-vs-indexed counts and the
  # queries people actually used. Bing matters more than its market share suggests:
  # ChatGPT's search grounding leans on Bing's index.
  verification:
    google: null    # Search Console > Add property > URL prefix > HTML tag
    bing: null      # Bing Webmaster Tools > Add site > HTML Meta Tag
  # IndexNow: a push notification that a URL changed, honoured by Bing, Yandex,
  # Seznam and Naver (not Google). `--deploy` submits the whole sitemap after
  # pushing, and `build_site.py` writes the `<key>.txt` proof-of-ownership file the
  # protocol requires -- generated, not uploaded, for the same reason as the tokens
  # above. Worth having because a rebuild that adds many pages at once is the case
  # organic discovery handles worst, and because Bing's index is what ChatGPT's
  # search grounding reads. Leave null to skip both steps entirely.
  #
  # The key is self-chosen, not issued: any 8-128 characters of [A-Za-z0-9-]. What
  # proves control is hosting it at `<base_url>/<key>.txt`, which build_site.py does,
  # so there is no account to create and nothing to keep secret -- publishing the key
  # is how the protocol works. The worst a stranger holding it can do is ask Bing to
  # recrawl pages that are already yours. Regenerate with `uuid.uuid4().hex` if you
  # ever want to; the only cost is that the first submission after the change 403s
  # until the new key file is live.
  indexnow_key: c6773a10d38042a78a215ca799c8aad3

github_sweep:
  # Forks are excluded: they are not yours to describe, and topics on a fork are
  # noise rather than signal.
  include_forks: false
  # Applied to every repo the sweep touches, on top of per-repo topics.
  base_topics: []
  # Repos to leave completely alone.
  exclude: []

visibility:
  # Engines to probe in measure/visibility.py.
  engines: [chatgpt, claude, perplexity, google-ai-mode]
