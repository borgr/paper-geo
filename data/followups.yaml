# Dated follow-ups: work that finishes somewhere else, days or months later.
#
# Some steps here end with "wait" -- arXiv staff verify an ownership request in a few
# days, Wikidata autoconfirms an account after four, ORCID-driven author merges at
# Semantic Scholar and OpenAlex happen on nobody's published schedule. The thing to do
# next only becomes possible once the wait is over, which makes these the easiest
# items in the project to lose.
#
# This file is the durable record. A conversational reminder does not survive the
# session it was set in, and a calendar entry loses the reason. Here the date and the
# reason sit together, in the repo, and `python update.py` surfaces anything due at
# the top of WORKLIST.md on every run -- so the next run is the reminder.
#
# Fields:
#   due     ISO date. Absolute, never relative -- "in three days" is unreadable later.
#   what    what you are waiting for
#   then    what becomes possible, or what to do if it did not land
#   check   optional shell command that answers it
#   owner   `human` (default) or `agent`. An `agent` item is a job for whoever runs the
#           pipeline next, not a task for the researcher: it needs no decision, only a
#           date that has passed. WORKLIST.md lists the two separately, because a list
#           that mixes "go and click this" with "this runs itself once the calendar
#           allows" trains its reader to skim both.
#
# Delete an entry when it is done. Re-run `python update.py --step worklist` after.

followups:
  # `human`, not `agent`. QuickStatements is a browser tool behind a logged-in
  # autoconfirmed account, so no pipeline run can do this however long it waits -- and
  # under the "for the pipeline, not for you" heading it read as something that would
  # happen on its own.
  - due: 2026-08-08
    owner: human
    what: >-
      Wikidata account Ktilana is autoconfirmed, so QuickStatements will accept a batch
      from it. Confirmed by the check below on 2026-08-10: registered 2026-08-04, 63
      edits, groups include `autoconfirmed`. The wait is over; what is left is a
      decision about the paper items.
    then: >-
      One batch is worth running and one is not. tasks/wikidata_papers.qs creates a
      public Wikidata item for each paper of yours that has none -- title, date, DOI or
      arXiv id, co-authors as name strings. Paste it at
      https://quickstatements.toolforge.org/#/batch, pick "QuickStatements version 1",
      and run. How many items that is, this run, is measured at the top of
      tasks/wikidata_followup.md and deliberately not repeated here: a count typed into
      a data file drifts away from the batch it describes. It is around a hundred new
      permanent public items either way, so read the "Is this legitimate?" section of
      tasks/wikidata_manual.md once before starting, and release it in a couple of
      batches rather than all at once so a formatting error costs ten items instead of
      all of them. tasks/wikidata.qs needs nothing from you: it is addressed to the
      existing item Q140867203 rather than creating one, and the audit's "Wikidata item
      complete" row reads 0 gaps, so it would add nothing. Run it only if that row ever
      shows a gap.
    check: python scripts/wikidata_apply.py --check-account

  - due: 2026-10-04
    what: >-
      ORCID auto-update, and the ORCID-driven author re-clustering at Semantic
      Scholar and OpenAlex, run on their own schedule.
    then: >-
      Re-check whether the duplicate S2 and OpenAlex author records merged
      themselves. Filing a support ticket before this date may be work you do not
      need to do.
    check: python scripts/audit_identity.py

  - due: 2026-11-04
    what: >-
      Crossref and DataCite auto-update only fire on newly deposited metadata that
      already carries your iD, so the proof is a work whose ORCID source is Crossref
      or DataCite rather than your own name -- which cannot appear until something
      you publish is deposited.
    then: >-
      If the audit's "works added by Crossref/DataCite" row is still 0 and a paper
      has been published since, the permission never completed or the publisher
      omitted your iD. Check ORCID > Account settings > Trusted parties first.
    check: python scripts/audit_identity.py --no-hf --no-names
