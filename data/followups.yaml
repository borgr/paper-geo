# Dated follow-ups: work that finishes somewhere else, days or months later.
#
# Some steps here end with "wait" -- arXiv staff verify an ownership request in a few
# days, Wikidata autoconfirms an account after four, ORCID-driven author merges at
# Semantic Scholar and OpenAlex happen on nobody's published schedule. The thing to do
# next only becomes possible once the wait is over, which makes these the easiest
# items in the project to lose.
#
# This file is the durable record. A conversational reminder does not survive the
# session it was set in, and a calendar entry loses the reason. Here the date and the
# reason sit together, in the repo, and `python update.py` surfaces anything due at
# the top of WORKLIST.md on every run -- so the next run is the reminder.
#
# Fields:
#   due     ISO date. Absolute, never relative -- "in three days" is unreadable later.
#   what    what you are waiting for
#   then    what becomes possible, or what to do if it did not land
#   check   optional shell command that answers it
#   owner   `human` (default) or `agent`. An `agent` item is a job for whoever runs the
#           pipeline next, not a task for the researcher: it needs no decision, only a
#           date that has passed. WORKLIST.md lists the two separately, because a list
#           that mixes "go and click this" with "this runs itself once the calendar
#           allows" trains its reader to skim both.
#
# Delete an entry when it is done. Re-run `python update.py --step worklist` after.

followups:
  - due: 2026-08-08
    owner: agent
    what: >-
      Wikidata account Ktilana reaches 4 days old (registered 2026-08-04 13:15 UTC).
      Autoconfirmed needs 4 days AND 50 edits; the edit half is already met (56 as of
      2026-08-05), so the age is what is left.
    then: >-
      Run the two QuickStatements batches -- tasks/wikidata.qs (author-item statements
      the API writer does not cover) and tasks/wikidata_papers.qs (the paper items) --
      at https://quickstatements.toolforge.org/#/batch, then report the diff. Nothing
      else waits on this: statements on the author item go through
      scripts/wikidata_apply.py, which uses a bot password and needs no autoconfirmed
      account.
    check: python scripts/wikidata_apply.py --check-account

  - due: 2026-10-04
    what: >-
      ORCID auto-update, and the ORCID-driven author re-clustering at Semantic
      Scholar and OpenAlex, run on their own schedule.
    then: >-
      Re-check whether the duplicate S2 and OpenAlex author records merged
      themselves. Filing a support ticket before this date may be work you do not
      need to do.
    check: python scripts/audit_identity.py

  - due: 2026-11-04
    what: >-
      Crossref and DataCite auto-update only fire on newly deposited metadata that
      already carries your iD, so the proof is a work whose ORCID source is Crossref
      or DataCite rather than your own name -- which cannot appear until something
      you publish is deposited.
    then: >-
      If the audit's "works added by Crossref/DataCite" row is still 0 and a paper
      has been published since, the permission never completed or the publisher
      omitted your iD. Check ORCID > Account settings > Trusted parties first.
    check: python scripts/audit_identity.py --no-hf --no-names

  - due: 2026-08-05
    what: >-
      The Project Debater datasets page is gone. http://ibm.biz/debater-datasets and
      the page it redirects to (research.ibm.com/haifa/dept/vst/debating_data.shtml)
      both 404, as does the parent directory; the Wayback CDX index has 200s up to
      2025-12-20, so it went dark in the first half of 2026. This is the download
      route named in three of your papers -- "Will it Blend?" (P18-2095), "Are You
      Convinced?" and "Corpus Wide Argument Mining" -- so every dataset they released
      currently has no reachable copy. research.ibm.com/interactive/project-debater/
      is still up but does not carry the data.
    then: >-
      Re-host the ones you are an author of, under your own Hugging Face account, and
      then add each as a links_extra entry in the sidecar of the paper that released
      it -- that is the only version of this that a reader or a crawler can follow.
      The archived catalogue (25 sections, all of Project Debater, not just yours) is
      at web.archive.org/web/20251220030633/https://research.ibm.com/haifa/dept/vst/debating_data.shtml
      and gives the dataset names and release notes, but not the files: downloads sat
      behind request forms, so Wayback never captured them. The page states CC-BY-SA
      for everything unless a release note says otherwise, so re-hosting with
      attribution is within licence. On Hugging Face today only
      ibm-research/argument_quality_ranking_30k survives; a search for "debater"
      returns third-party re-uploads of ArgKP and nothing for the evidence-detection
      sets. Sidecars deliberately carry no link to the dead page in the meantime.
    check: curl -sSL -o /dev/null -w '%{http_code}\n' http://ibm.biz/debater-datasets
