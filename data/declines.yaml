# What you have decided not to do, so WORKLIST.md stops asking.
#
# The worklist is generated from live state on every run, which is what keeps it
# honest -- and also what makes it unable to tell "not done yet" from "read it,
# decided against it". Without this file the second case reappears forever, and a
# list that keeps asking for what you have ruled out is a list you stop reading.
#
# This is the only place in the repo where a decision is recorded as an absence.
# Everything else records decisions positively (`reviewed: true`, an accepted
# sidecar, a line in overrides.yaml), so declining needed a home of its own.
#
#   sections:  any worklist heading containing this string, and its whole body.
#              Matched case-insensitively at `##` and `###` level, so a subsection
#              can go without its siblings.
#   items:     any `- [ ]` line containing this string -- an arXiv id, a slug, a
#              repo name. Use this to decline the tail of a long list while
#              keeping the top of it open.
#   deferred:  not declined, just not now. `{match: "...", until: "..."}` moves the
#              matching section to a "Deferred" heading at the bottom of the
#              worklist, still regenerated from live state, with `until` printed as
#              the condition that brings it back up. Use this instead of `sections`
#              when you do intend to do the work.
#
# Read by update.py's worklist step, which reports at the bottom of WORKLIST.md
# how much it hid. Delete a line here and the item is asked again on the next run.
#
# Examples, both deliberately commented out -- nothing is declined until you say so:
#
# sections:
#   - "OpenAlex"          # their own disambiguation is ORCID-driven; leave it
# items:
#   - "2104.08202"        # journal-ref: co-author submitted, no paper password

sections:
  # Their disambiguation is ORCID-driven and they are running ORCID-based merges, so
  # the ORCID work above is the fix for this too. Their "Fix errors" form is the only
  # other route and it is a request, not an edit. Nothing to do here that is not
  # already being done one surface up.
  - "OpenAlex"
items:
  # Two of the three Scholar rows missing from the bibliography, ruled out by the
  # author. The third, "A Statistical Framework for Game-Based AI Evaluation", is a
  # real workshop paper and stays open.
  #
  # A competition report, not a paper. It stays out of the bibliography for the same
  # reason the BabyLM calls for papers are in it under their own kind: what a record is
  # governs where it belongs, and 19 citations do not make a shared task a paper.
  - "Llm merging"
  # "sounds mine but don't bother with it" -- 0 citations, no identifier on the Scholar
  # row, and nothing downstream resolves a work with neither. Declined rather than
  # deferred: chasing it would cost more than the record is worth.
  - "True or false? faithful summarization"
deferred:
  # The papers are the higher-leverage half and the repo sweep is a bounded
  # afternoon, so it waits -- but it is real work, not declined. Keeping it in the
  # file rather than in someone's head is the point: it stays counted and stays
  # accurate while it waits.
  - match: "Repo labels"
    until: "the sidecar format is settled and the papers are done"
  # Fourteen release DOIs is fourteen Zenodo-GitHub authorisations and fourteen tagged
  # releases, and it buys citability for tools nobody is citing yet. Deferred rather
  # than declined because the papers ahead of it are worth more per hour, not because
  # the case is wrong -- and the condition below is the honest trigger: a DOI matters
  # once somebody wants to cite the thing.
  - match: "Artifacts with no citation route"
    until: "an artifact is cited or asked about somewhere you can see it, or the paper work is done"
