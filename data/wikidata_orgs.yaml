# Items for the collectives this work belongs to that Wikidata has no item for.
#
# Hand-maintained, and read by `scripts/wikidata_orgs.py`, which checks what already
# exists and writes a QuickStatements batch to paste. Nothing here edits Wikidata.
#
# Every statement carries `ref`, the URL a reader can check it against -- Wikidata
# notability asks for "serious and publicly available references", and a statement whose
# only source is us is not one. A fact with no public source goes under `needs`, which
# puts it on the task page as a question instead of in the batch.
#
# `note` is a gloss of the value and is verified against the live label, so a mistyped
# QID is caught before the paste rather than after. `q` is qualifiers on the statement,
# in the same shape.

items:
  evaleval-coalition:
    label: EvalEval Coalition
    description: research coalition on the evaluation of AI evaluations
    aliases: [EvalEval]
    statements:
      - {p: P31,   v: Q20747412,  note: research consortium,     ref: "https://evalevalai.com/"}
      - {p: P101,  v: Q11660,     note: artificial intelligence, ref: "https://evalevalai.com/"}
      - {p: P101,  v: Q1379672,   note: evaluation,              ref: "https://evalevalai.com/"}
      # No founding is announced anywhere, so the earliest public trace of the coalition
      # stands as the date.
      - {p: P571,  v: "+2024-07-22T00:00:00Z/11", note: "GitHub organisation created",
         ref: "https://github.com/evaleval"}
      - {p: P856,  v: '"https://evalevalai.com/"',               ref: "https://evalevalai.com/"}
      - {p: P2037, v: '"evaleval"',                              ref: "https://github.com/evaleval"}
      - {p: P2002, v: '"evaluatingevals"',                       ref: "https://github.com/evaleval"}
      # Wikidata has no property for a host institution, so the three named under
      # "Hosted By" are affiliations carrying the role that says which kind.
      - {p: P1416, v: Q108943604, note: Hugging Face,            ref: "https://github.com/evaleval",
         q: [{p: P3831, v: Q10870991, note: host}]}
      - {p: P1416, v: Q160302,    note: University of Edinburgh, ref: "https://github.com/evaleval",
         q: [{p: P3831, v: Q10870991, note: host}]}
      - {p: P1416, v: Q106289326, note: EleutherAI,              ref: "https://github.com/evaleval",
         q: [{p: P3831, v: Q10870991, note: host}]}
    # Items that already exist and should point at this one once it has a QID.
    organizer_of:
      - {qid: Q131426993, note: "Evaluating Evaluations (NeurIPS 2024 workshop)"}

  babylm-challenge:
    label: BabyLM Challenge
    description: shared task and workshop series on sample-efficient language model pretraining
