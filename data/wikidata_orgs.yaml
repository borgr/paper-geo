      - {p: P101,  v: Q30642,    note: natural language processing,  ref: "https://babylm.github.io/"}
      - {p: P571,  v: "+2023-00-00T00:00:00Z/9", note: "first edition, CoNLL 2023",
         ref: "https://aclanthology.org/venues/babylm/"}
      - {p: P856,  v: '"https://babylm.github.io/"',                 ref: "https://babylm.github.io/"}
      - {p: P2037, v: '"babylm"',                                    ref: "https://github.com/babylm"}
    # Corpus papers whose main subject (P921) is this, resolved through the item ledger.
