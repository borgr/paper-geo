_comment: The arXiv version each live sidecar was drafted against. Written by scripts/draft_sidecars.py
  on --accept and by --record-versions, read by scripts/worklist.py, which asks for a re-draft when arXiv
  moves past the recorded number. A slug absent from here is unknown rather than v1. Dates and git both
  fail at this -- a commit touching every sidecar at once resets them and hides a revision that landed
  before it. `framed_at` is when each sidecar was last accepted or refreshed and the paper's citations
  then; scripts/draft_sidecars.py reads it to queue the one-off framing refreshes at 1 year, 3 years and
  10 citations.
