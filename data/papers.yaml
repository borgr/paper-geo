- key: DBLP:conf/conll/ChoshenA19
  slug: automatically-extracting-challenge-sets-for-non-local-phenom
  title: Automatically Extracting Challenge Sets for Non-Local Phenomena in Neural Machine Translation
  authors:
  - Leshem Choshen
  - Omri Abend
  year: 2019
  venue: Proceedings of the 23rd Conference on Computational Natural Language Learning, CoNLL 2019, Hong
    Kong, China, November 3-4, 2019
  type: inproceedings
  doi: 10.18653/V1/K19-1028
  arxiv: '1909.06814'
  url: https://doi.org/10.18653/v1/K19-1028
  abstract: We show that the state-of-the-art Transformer MT model is not biased towards monotonic reordering
    (unlike previous recurrent neural network models), but that nevertheless, long-distance dependencies
    remain a challenge for the model. Since most dependencies are short-distance, common evaluation metrics
    will be little influenced by how well systems perform on them. We therefore propose an automatic approach
    for extracting challenge sets rich with long-distance dependencies, and argue that evaluation using
    this methodology provides a complementary perspective on system performance. To support our claim,
    we compile challenge sets for English-German and German-English, which are much larger than any previously
    released challenge set for MT. The extracted sets are large enough to allow reliable automatic evaluation,
    which makes the proposed approach a scalable and practical solution for evaluating MT performance
    on the long-tail of syntactic phenomena.
