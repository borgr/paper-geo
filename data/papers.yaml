  url: https://doi.org/10.1038/s41586-021-03215-w
  abstract: Artificial intelligence (AI) is defined as the ability of machines to perform tasks that are
    usually associated with intelligent beings. Argument and debate are fundamental capabilities of human
    intelligence, essential for a wide range of human activities, and common to all human societies. The
    development of computational argumentation technologies is therefore an important emerging discipline
    in AI research 1 . Here we present Project Debater, an autonomous debating system that can engage
    in a competitive debate with humans. We provide a complete description of the system's architecture,
    a thorough and systematic evaluation of its operation across a wide range of debate topics, and a
    detailed account of the system's performance in its public debut against three expert human debaters.
    We also highlight the fundamental differences between debating with humans as opposed to challenging
    humans in game competitions, the latter being the focus of classical 'grand challenges' pursued by
    the AI research community over the past few decades. We suggest that such challenges lie in the 'comfort
    zone' of AI, whereas debating with humans lies in a different territory, in which humans still prevail,
    and for which novel paradigms are required to make substantial progress.
