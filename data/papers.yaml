- key: habba2026growing
  slug: growing-pains-extensible-and-efficient-llm-benchmarking-via
  title: 'Growing Pains: Extensible and Efficient LLM Benchmarking Via Fixed Parameter Calibration'
  authors:
  - Eliya Habba
  - Itay Itzhak
  - Asaf Yehudai
  - Yotam Perlitz
  - Elron Bandel
  - Michal Shmueli-Scheuer
  - Leshem Choshen
