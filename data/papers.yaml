- key: warstadt2023findings
  slug: findings-of-the-b-aby-lm-challenge-sample-efficient-pretrain
  title: 'Findings of the {B}aby{LM} Challenge: Sample-Efficient Pretraining on Developmentally Plausible
    Corpora'
  authors:
  - Alex Warstadt
  - Aaron Mueller
  - Leshem Choshen
  - Ethan Wilcox
  - Chengxu Zhuang
  - Juan Ciro
  - Rafael Mosquera
  - Bhargavi Paranjabe
