  slug: q2-evaluating-factual-consistency-in-knowledge-grounded-dial
  title: 'Q\({}^{\mbox{2}}\): Evaluating Factual Consistency in Knowledge-Grounded Dialogues via Question
    Generation and Question Answering'
  authors:
  - Or Honovich
  - Leshem Choshen
  - Roee Aharoni
  - Ella Neeman
  - Idan Szpektor
  - Omri Abend
  authors_truncated: null
