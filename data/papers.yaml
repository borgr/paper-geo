  title: 'TIES-Merging: Resolving Interference When Merging Models'
  authors:
  - Prateek Yadav
  - Derek Tam
  - Leshem Choshen
  - Colin A. Raffel
  - Mohit Bansal
  authors_truncated: null
  year: 2023
  venue: 'Advances in Neural Information Processing Systems 36: Annual Conference on Neural Information
