  title: 'A Survey on Model MoErging: Recycling and Routing Among Specialized Experts for Collaborative
    Learning'
  authors:
  - Prateek Yadav
  - Colin Raffel
  - Mohammed Muqeeth
  - Lucas Caccia
  - Haokun Liu
  - Tianlong Chen
  - Mohit Bansal
  - Leshem Choshen
