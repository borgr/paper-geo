  title: 'Navigating the Modern Evaluation Landscape: Considerations in Benchmarks and Frameworks for
    Large Language Models (LLMs)'
  authors:
  - Leshem Choshen
  - Ariel Gera
  - Yotam Perlitz
  - Michal Shmueli-Scheuer
  - Gabriel Stanovsky
  authors_truncated: null
