  doi: 10.18653/v1/2025.acl-demo.17
  arxiv: '2408.08291'
  url: https://aclanthology.org/2025.acl-demo.17/
  abstract: Human-model conversations provide a window into users' real-world scenarios, behavior, and
    needs, and thus are a valuable resource for model development and research. While for-profit companies
    collect user data through the APIs of their models, using it internally to improve their own models,
    the open source and research community lags behind. We introduce the ShareLM collection, a unified
    set of human conversations with large language models, and its accompanying plugin, a Web extension
    for voluntarily contributing user-model conversations. Where few platforms share their chats, the
    ShareLM plugin adds this functionality, thus, allowing users to share conversations from most platforms.
    The plugin allows the user to rate their conversations, both at the conversation and the response
    levels, and delete conversations they prefer to keep private before they ever leave the user{'}s local
    storage.
