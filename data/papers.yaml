  slug: holmes-a-benchmark-to-assess-the-linguistic-competence-of-la
  title: 'Holmes: {A} Benchmark to Assess the Linguistic Competence of Language Models'
  authors:
  - Andreas Waldis
  - Yotam Perlitz
  - Leshem Choshen
  - Yufang Hou
  - Iryna Gurevych
  authors_truncated: null
  year: 2024
