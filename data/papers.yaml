  slug: resolving-interference-ri-disentangling-models-for-improved
  title: 'Resolving Interference (RI): Disentangling Models for Improved Model Merging'
  authors: []
  year: 2026
  venue: arXiv.org
  type: null
  doi: 10.48550/arXiv.2603.13467
  arxiv: '2603.13467'
  url: null
  abstract: 'Model merging has shown that multitask models can be created by directly combining the parameters
    of different models that are each specialized on tasks of interest. However, models trained independently
    on distinct tasks often exhibit interference that degrades the merged model''s performance. To solve
    this problem, we formally define the notion of Cross-Task Interference as the drift in the representation
    of the merged model relative to its constituent models. Reducing cross-task interference is key to
    improving merging performance. To address this issue, we propose our method, Resolving Interference
    (RI), a light-weight adaptation framework which disentangles expert models to be functionally orthogonal
    to the space of other tasks, thereby reducing cross-task interference. RI does this whilst using only
    unlabeled auxiliary data as input (i.e., no task-data is needed), allowing it to be applied in data-scarce
    scenarios. RI consistently improves the performance of state-of-the-art merging methods by up to 3.8%
    and generalization to unseen domains by up to 2.3%. We also find RI to be robust to the source of
    auxiliary input while being significantly less sensitive to tuning of merging hyperparameters. Our
    codebase is available at: https://github.com/pramesh39/resolving_interference'
