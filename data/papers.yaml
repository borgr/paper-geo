- key: DBLP:journals/corr/abs-2404-18923
  slug: holmes-benchmark-the-linguistic-competence-of-language-model
  title: 'Holmes: Benchmark the Linguistic Competence of Language Models'
  authors:
  - Andreas Waldis
  - Yotam Perlitz
  - Leshem Choshen
  - Yufang Hou
  - Iryna Gurevych
  year: 2024
  venue: CoRR (accepted to TaCL)
  type: article
  doi: 10.48550/ARXIV.2404.18923
  arxiv: '2404.18923'
  url: https://doi.org/10.48550/arXiv.2404.18923
  abstract: We introduce Holmes, a new benchmark designed to assess language models (LMs) linguistic competence
    - their unconscious understanding of linguistic phenomena. Specifically, we use classifier-based probing
    to examine LMs' internal representations regarding distinct linguistic phenomena (e.g., part-of-speech
    tagging). As a result, we meet recent calls to disentangle LMs' linguistic competence from other cognitive
    abilities, such as following instructions in prompting-based evaluations. Composing Holmes, we review
    over 270 probing studies and include more than 200 datasets to assess syntax, morphology, semantics,
    reasoning, and discourse phenomena. Analyzing over 50 LMs reveals that, aligned with known trends,
    their linguistic competence correlates with model size. However, surprisingly, model architecture
    and instruction tuning also significantly influence performance, particularly in morphology and syntax.
    Finally, we propose FlashHolmes, a streamlined version that reduces the computation load while maintaining
    high-ranking precision.
