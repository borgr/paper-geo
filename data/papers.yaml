  slug: efficient-benchmarking-of-language-models
  title: Efficient Benchmarking (of Language Models)
  authors:
  - Yotam Perlitz
  - Elron Bandel
  - Ariel Gera
  - Ofir Arviv
  - Liat Ein-Dor
  - Eyal Shnarch
  - Noam Slonim
