- key: DBLP:journals/corr/abs-2407-10944
  slug: naturally-occurring-feedback-is-common-extractable-and-usefu
  title: Naturally Occurring Feedback is Common, Extractable and Useful
  authors:
  - Shachar Don-Yehiya
  - Leshem Choshen
  - Omri Abend
  authors_truncated: null
  year: 2025
  venue: null
  type: misc
  doi: null
  arxiv: '2407.10944'
  url: https://arxiv.org/abs/2407.10944
  abstract: 'Human feedback data is a critical component in developing language models. However, collecting
    this feedback is costly and ultimately not scalable. Inspired by the way human interlocutors provide
    spontaneous unsolicited feedback to each other, we propose to extract feedback that users naturally
    include when interacting with chat models. We manually annotated conversations to confirm the presence
    of naturally occurring feedback in a standard corpus, finding that as much as 30% of the chats include
    explicit feedback. Comparing to older datasets, we find that naturally occurring feedback is more
    prevalent in recent conversation datasets, suggesting that more than ever, naturally occurring feedback
    can serve as a valuable resource for feedback data. We propose a method for automatically extracting
    this feedback, and apply it to over 1M conversations to obtain hundreds of thousands of feedback samples.
    The extracted feedback shows promise: training with it improves over baseline models and enhances
    model alignment to human preferences.'
