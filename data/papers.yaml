  title: Semantics-aware Attention Improves Neural Machine Translation
  authors:
  - Aviv Slobodkin
  - Leshem Choshen
  - Omri Abend
  year: 2022
  venue: Proceedings of the 11th Joint Conference on Lexical and Computational Semantics, *SEM@NAACL-HLT
    2022, Seattle, WA, USA, July 14-15, 2022
  type: inproceedings
