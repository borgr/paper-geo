  title: 'Call for Papers - The BabyLM Challenge: Sample-efficient pretraining on a developmentally plausible
    corpus'
  authors:
  - Alex Warstadt
  - Leshem Choshen
  - Aaron Mueller
  - Adina Williams
  - Ethan Gotlieb Wilcox
  - Chengxu Zhuang
  year: 2023
  venue: arXiv.org
