  slug: llm-hypnosis-exploiting-user-feedback-for-unauthorized-knowl
  title: 'LLM Hypnosis: Exploiting User Feedback for Unauthorized Knowledge Injection to All Users'
  authors:
  - Almog Hilel
  - Idan Shenfeld
  - Jacob Andreas
  - Leshem Choshen
  authors_truncated: null
  year: 2025
  venue: arXiv preprint arXiv:2507.02850
