- key: DBLP:conf/acl/AbendC18
  slug: inherent-biases-in-reference-based-evaluation-for-grammatica
  title: Inherent Biases in Reference-based Evaluation for Grammatical Error Correction
  authors:
  - Leshem Choshen
  - Omri Abend
  authors_truncated: null
  year: 2018
  venue: 'Proceedings of the 56th Annual Meeting of the Association for Computational Linguistics, {ACL}
    2018, Melbourne, Australia, July 15-20, 2018, Volume 1: Long Papers'
  type: inproceedings
  doi: 10.18653/V1/P18-1059
  arxiv: '1804.11254'
  url: https://aclanthology.org/P18-1059/
  abstract: The prevalent use of too few references for evaluating text-to-text generation is known to
    bias estimates of their quality (henceforth, low coverage bias or LCB). This paper shows that overcoming
    LCB in Grammatical Error Correction (GEC) evaluation cannot be attained by re-scaling or by increasing
    the number of references in any feasible range, contrary to previous suggestions. This is due to the
    long-tailed distribution of valid corrections for a sentence. Concretely, we show that LCB incentivizes
    GEC systems to avoid correcting even when they can generate a valid correction. Consequently, existing
    systems obtain comparable or superior performance compared to humans, by making few but targeted changes
    to the input. Similar effects on Text Simplification further support our claims.
