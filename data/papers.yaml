- key: DBLP:conf/emnlp/ShnarchCMAS20
  slug: unsupervised-expressive-rules-provide-explainability-and-ass
  title: Unsupervised Expressive Rules Provide Explainability and Assist Human Experts Grasping New Domains
  authors:
  - Eyal Shnarch
  - Leshem Choshen
  - Guy Moshkowich
  - Ranit Aharonov
  - Noam Slonim
  authors_truncated: null
  year: 2020
  venue: 'Findings of the Association for Computational Linguistics: {EMNLP} 2020, Online Event, 16-20
    November 2020'
  type: inproceedings
  doi: 10.18653/V1/2020.FINDINGS-EMNLP.243
  arxiv: '2010.09459'
  url: https://doi.org/10.18653/v1/2020.findings-emnlp.243
  abstract: Approaching new data can be quite deterrent; you do not know how your categories of interest
    are realized in it, commonly, there is no labeled data at hand, and the performance of domain adaptation
    methods is unsatisfactory. Aiming to assist domain experts in their first steps into a new task over
    a new corpus, we present an unsupervised approach to reveal complex rules which cluster the unexplored
    corpus by its prominent categories (or facets). These rules are human-readable, thus providing an
    important ingredient which has become in short supply lately - explainability. Each rule provides
    an explanation for the commonality of all the texts it clusters together. The experts can then identify
    which rules best capture texts of their categories of interest, and utilize them to deepen their understanding
    of these categories. These rules can also bootstrap the process of data labeling by pointing at a
    subset of the corpus which is enriched with texts demonstrating the target categories. We present
    an extensive evaluation of the usefulness of these rules in identifying target categories, as well
    as a user study which assesses their interpretability.
