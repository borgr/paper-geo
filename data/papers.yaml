  title: Reference-less Measure of Faithfulness for Grammatical Error Correction
  authors:
  - Leshem Choshen
  - Omri Abend
  year: 2018
  venue: 'Proceedings of the 2018 Conference of the North American Chapter of the Association for Computational
    Linguistics: Human Language Technologies, NAACL-HLT, New Orleans, Louisiana, USA, June 1-6, 2018,
    Volume 2 (Short Papers)'
  type: inproceedings
  doi: 10.18653/V1/N18-2020
  arxiv: '1804.03824'
  url: https://doi.org/10.18653/v1/n18-2020
  abstract: We propose USim, a semantic measure for Grammatical Error Correction (that measures the semantic
    faithfulness of the output to the source, thereby complementing existing reference-less measures (RLMs)
    for measuring the output’s grammaticality. USim operates by comparing the semantic symbolic structure
    of the source and the correction, without relying on manually-curated references. Our experiments
    establish the validity of USim, by showing that the semantic structures can be consistently applied
    to ungrammatical text, that valid corrections obtain a high USim similarity score to the source, and
    that invalid corrections obtain a lower score.
