- key: gabrielsson2025compress
  slug: compress-then-serve-serving-thousands-of-lora-adapters-with
  title: 'Compress then Serve: Serving Thousands of Lo{RA} Adapters with Little Overhead'
  authors:
  - Rickard Brüel Gabrielsson
  - Jiacheng Zhu
  - Onkar Bhardwaj
  - Leshem Choshen
  - Kristjan Greenewald
  - Mikhail Yurochkin
  - Justin Solomon
