  arxiv: null
  url: null
  abstract: General-Purpose Language Models have changed the world of Natural Language Processing, if
    not the world itself. The evaluation of such versatile models, while supposedly similar to evaluation
    of generation models before them, in fact presents a host of new evaluation challenges and opportunities.
    In this Tutorial, we will start from the building blocks of evaluation. The tutorial welcomes people
    from diverse backgrounds and assumes little familiarity with metrics, datasets, prompts and benchmarks.
    It will lay the foundations and explain the basics and their importance, while touching on the major
    points and breakthroughs of the recent era of evaluation. It will also compare traditional evaluation
    methods – which are still widely used – to newly developed methods. We will contrast new to old approaches,
    from evaluating on many-task benchmarks rather than on dedicated datasets to efficiency constraints,
    and from testing stability and prompts on in-context learning to using the models themselves as evaluation
    metrics. Finally, the tutorial will cover practical issues, ranging from reviewing widely-used benchmarks
    and prompt banks to efficient evaluation.
