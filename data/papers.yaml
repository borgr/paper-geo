  arxiv: '2601.06672'
  url: https://doi.org/10.18653/v1/2026.findings-acl.1322
  abstract: 'Model merging has emerged as a promising technique for combining multiple fine-tuned models
    into a single multitask model without retraining. However, the factors that determine whether merging
    will succeed or fail remain poorly understood. In this work, we investigate why specific models are
    merged better than others. To do so, we propose a concrete, measurable definition of mergeability.
    We investigate several potential causes for high or low mergeability, highlighting the base model
    knowledge as a dominant factor: Models fine-tuned on instances that the base model knows better are
    more mergeable than models fine-tuned on instances that the base model struggles with. Based on our
    mergeability definition, we explore a simple weighted merging technique that better preserves weak
    knowledge in the base model.'
