- key: saroufim2025neurips
  slug: neurips-2023-llm-efficiency-fine-tuning-competition
  title: '{NeurIPS} 2023 {LLM} Efficiency Fine-tuning Competition'
  authors:
  - Mark Saroufim
  - Yotam Perlitz
  - Leshem Choshen
  - Luca Antiga
  - Greg Bowyer
  - Christian Puhrsch
  - Driss Guessous
