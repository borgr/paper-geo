  authors_truncated: null
  year: 2025
  venue: 'Findings of the Association for Computational Linguistics: ACL 2025'
  type: inproceedings
  doi: 10.18653/v1/2025.findings-acl.611
  arxiv: '2503.01622'
  url: https://aclanthology.org/2025.findings-acl.611/
  abstract: 'Recent work found that LLMs are sensitive to a wide range of arbitrary prompt dimensions,
    including the type of delimiters, answer enumerators, instruction wording, and more. This throws into
    question popular single-prompt evaluation practices. We present DOVE (Dataset Of Variation Evaluation)
    a large-scale dataset containing prompt perturbations of various evaluation benchmarks. In contrast
    to previous work, we examine LLM sensitivity from an holistic perspective, and assess the joint effects
    of perturbations along various dimensions, resulting in thousands of perturbations per instance. We
    evaluate several model families against DOVE, leading to several findings, including efficient methods
    for choosing well-performing prompts, observing that few-shot examples reduce sensitivity, and identifying
    instances which are inherently hard across all perturbations. DOVE consists of more than 250M prompt
    perturbations and model outputs, which we make publicly available to spur a community-wide effort
    toward meaningful, robust, and efficient evaluation. Browse the data, contribute, and more at: https://slab-nlp.github.io/DOVE'
