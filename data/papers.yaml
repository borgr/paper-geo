- key: waldis2026instructions
  slug: instructions-shape-production-of-language-not-processing
  title: Instructions Shape Production of Language, not Processing
  authors:
  - Andreas Waldis
  - Leshem Choshen
  - Yufang Hou
  - Yotam Perlitz
  authors_truncated: null
  year: 2026
  venue: arXiv preprint arXiv:2605.11206
  type: article
  doi: 10.48550/arXiv.2605.11206
  arxiv: '2605.11206'
  url: null
  abstract: 'Instructions trigger a production-centered mechanism in language models. Through a cognitively
    inspired lens that separates language processing and production, we reveal this mechanism as an asymmetry
    between the two stages by probing task-specific information layer-wise across five binary judgment
    tasks. Specifically, we measure how instruction tokens shape information both when sample tokens,
    the input under evaluation, are processed and when output tokens are produced. Across prompting variations,
    task-specific information in sample tokens remains largely stable and correlates only weakly with
    behavior, whereas the same information in output tokens varies substantially and correlates strongly
    with behavior. Attention-based interventions confirm this pattern causally: blocking instruction flow
    to all subsequent tokens reduces both behavior and information in output tokens, whereas blocking
    it only to sample tokens has minimal effect on either. The asymmetry generalizes across model families
    and tasks, and becomes sharper with model scale and instruction-tuning, both of which disproportionately
    affect the production stage. Our findings suggest that understanding model capabilities requires jointly
    assessing internals and behavior, while decomposing the internal perspective by token position to
    distinguish the processing of input tokens from the production of output tokens.'
