  abstract: TextArena is an open-source collection of competitive text-based games for training and evaluation
    of agentic behavior in Large Language Models (LLMs). It spans 57+ unique environments (including single-player,
    two-player, and multi-player setups) and allows for easy evaluation of model capabilities via an online-play
    system (against humans and other submitted models) with real-time TrueSkill scores. Traditional benchmarks
    rarely assess dynamic social skills such as negotiation, theory of mind, and deception, creating a
    gap that TextArena addresses. Designed with research, community and extensibility in mind, TextArena
    emphasizes ease of adding new games, adapting the framework, testing models, playing against the models,
    and training models. Detailed documentation of environments, games, leaderboard, and examples are
    available on https://github.com/LeonGuertler/TextArena and https://www.textarena.ai/.
