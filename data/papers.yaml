  doi: 10.18653/V1/2022.ACL-LONG.526
  arxiv: '2203.10581'
  url: https://doi.org/10.18653/v1/2022.acl-long.526
  abstract: In real-world scenarios, a text classification task often begins with a cold start, when labeled
    data is scarce. In such cases, the common practice of fine-tuning pre-trained models, such as BERT,
    for a target classification task, is prone to produce poor performance. We suggest a method to boost
    the performance of such models by adding an intermediate unsupervised classification task, between
    the pre-training and fine-tuning phases. As such an intermediate task, we perform clustering and train
    the pre-trained model on predicting the cluster labels.We test this hypothesis on various data sets,
    and show that this additional classification phase can significantly improve performance, mainly for
    topical classification tasks, when the number of labeled instances available for fine-tuning is only
    a couple of dozen to a few hundred.
