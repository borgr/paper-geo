  slug: disentqa-disentangling-parametric-and-contextual-knowledge-w
  title: 'DisentQA: Disentangling Parametric and Contextual Knowledge with Counterfactual Question Answering'
  authors:
  - Ella Neeman
  - Roee Aharoni
  - Or Honovich
  - Leshem Choshen
  - Idan Szpektor
  - Omri Abend
  authors_truncated: null
