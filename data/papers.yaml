- key: DBLP:journals/corr/abs-2205-05730
  slug: some-grammatical-errors-are-frequent-others-are-important
  title: Some Grammatical Errors are Frequent, Others are Important
  authors:
  - Leshem Choshen
  - Ofir Shifman
  - Omri Abend
  year: 2022
  venue: CoRR
  type: article
  doi: 10.48550/ARXIV.2205.05730
  arxiv: '2205.05730'
  url: https://doi.org/10.48550/arXiv.2205.05730
  abstract: In Grammatical Error Correction, systems are evaluated by the number of errors they correct.
    However, no one has assessed whether all error types are equally important. We pro-vide and apply
    a method to quantify the importance of different grammatical error types to humans. We show that some
    rare errors are considered disturbing while other common ones are not. This affects possible directions
    to improve both systems and their evaluation. 1
