- key: DBLP:journals/corr/abs-2301-11796
  slug: call-for-papers-the-babylm-challenge-sample-efficient-pretra
  title: 'Call for Papers - The BabyLM Challenge: Sample-efficient pretraining on a developmentally plausible
    corpus'
  authors:
  - Alex Warstadt
  - Leshem Choshen
  - Aaron Mueller
  - Adina Williams
  - Ethan Wilcox
  - Chengxu Zhuang
  year: 2023
  venue: CoRR
  type: article
  doi: 10.48550/ARXIV.2301.11796
  arxiv: '2301.11796'
  url: https://doi.org/10.48550/arXiv.2301.11796
  abstract: 'We present the call for papers for the BabyLM Challenge: Sample-efﬁcient pretraining on a
    developmentally plausible corpus. This shared task is intended for participants with an interest in
    small scale language modeling, human language acquisition, low-resource NLP, and cognitive modeling.
    In partnership with CoNLL and CMCL, we provide a platform for approaches to pretraining with a limited-size
    corpus sourced from data inspired by the input to children. The task has three tracks, two of which
    restrict the training data to pre-released datasets of 10M and 100M words and are ded-icated to explorations
    of approaches such as architectural variations, self-supervised objec-tives, or curriculum learning.
    The ﬁnal track only restricts the amount of text used, allowing innovation in the choice of the data,
    its domain, and even its modality (i.e., data from sources other than text is welcome). We will release
    a shared evaluation pipeline which scores models on a variety of benchmarks and tasks, in-cluding
    targeted syntactic evaluations and natural language understanding.'
