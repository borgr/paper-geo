  title: '[Call for Papers] The 2nd BabyLM Challenge: Sample-efficient pretraining on a developmentally
    plausible corpus'
  authors:
  - Leshem Choshen
  - Ryan Cotterell
  - Michael Y. Hu
  - Tal Linzen
  - Aaron Mueller
  - Candace Ross
  - Alex Warstadt
