  title: 'Human Learning by Model Feedback: The Dynamics of Iterative Prompting with Midjourney'
  authors:
  - Shachar Don-Yehiya
  - Leshem Choshen
  - Omri Abend
  year: 2023
  venue: Proceedings of the 2023 Conference on Empirical Methods in Natural Language Processing, {EMNLP}
