- key: polo2024sloth
  slug: sloth-scaling-laws-for-llm-skills-to-predict-multi-benchmark
  title: 'Sloth: scaling laws for {LLM} skills to predict multi-benchmark performance across families'
  authors:
  - Felipe Maia Polo
  - Seamus Somerstep
  - Leshem Choshen
  - Yuekai Sun
  - Mikhail Yurochkin
  year: 2025
  venue: The Thirty-ninth Annual Conference on Neural Information Processing Systems
  type: inproceedings
  doi: 10.48550/arXiv.2412.06540
  arxiv: '2412.06540'
  url: https://openreview.net/forum?id=9GN5Jsa3lv
  abstract: Scaling laws for large language models (LLMs) predict model performance based on parameters
    like size and training data. However, differences in training configurations and data processing across
    model families lead to significant variations in benchmark performance, making it difficult for a
    single scaling law to generalize across all LLMs. On the other hand, training family-specific scaling
    laws requires training models of varying sizes for every family. In this work, we propose Skills Scaling
    Laws (SSLaws, pronounced as Sloth), a novel scaling law that leverages publicly available benchmark
    data and assumes LLM performance is driven by low-dimensional latent skills, such as reasoning and
    instruction following. These latent skills are influenced by computational resources like model size
    and training tokens, but with varying efficiencies across model families. Sloth exploits correlations
    across benchmarks to provide more accurate and interpretable predictions while alleviating the need
    to train multiple LLMs per family. We present both theoretical results on parameter identification
    and empirical evaluations on 12 prominent benchmarks, from Open LLM Leaderboard v1/v2, demonstrating
    that Sloth predicts LLM performance accurately and offers insights into scaling behaviors for complex
    downstream tasks, increased test-time compute, and compute-optimal scaling of skills.
