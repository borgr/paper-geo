  slug: livexiv-a-multi-modal-live-benchmark-based-on-arxiv-papers-c
  title: LiveXiv - A Multi-Modal live benchmark based on Arxiv papers content
  authors:
  - Nimrod Shabtay
  - Felipe Maia Polo
