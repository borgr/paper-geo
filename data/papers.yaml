- key: vetzler2025crisp
  slug: crisp-complex-reasoning-with-interpretable-step-based-plans
  title: 'CRISP: Complex Reasoning with Interpretable Step-based Plans'
  authors:
  - Matan Vetzler
  - Koren Lazar
