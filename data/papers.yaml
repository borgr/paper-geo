  title: 'Fuse to Forget: Bias Reduction and Selective Memorization through Model Fusion'
  authors:
  - Kerem Zaman
  - Leshem Choshen
  - Shashank Srivastava
  authors_truncated: null
  year: 2024
  venue: Proceedings of the 2024 Conference on Empirical Methods in Natural Language Processing, {EMNLP}
    2024, Miami, FL, USA, November 12-16, 2024
  type: inproceedings
  doi: 10.18653/V1/2024.EMNLP-MAIN.1045
  arxiv: '2311.07682'
  url: https://doi.org/10.18653/v1/2024.emnlp-main.1045
  abstract: 'Model fusion research aims to aggregate the knowledge of multiple individual models to enhance
    performance by combining their weights. In this work, we study the inverse problem: investigating
    whether model fusion can be used to reduce unwanted knowledge. We investigate the effects of model
    fusion in three scenarios: the learning of shortcuts, social biases, and memorization of training
    data in fine-tuned language models. Through experiments covering classification and generation tasks,
    our analysis highlights that shared knowledge among models is enhanced during model fusion, while
    unshared knowledge is usually forgotten. Based on this observation, we demonstrate the potential of
    model fusion as a debiasing tool and showcase its efficacy in addressing privacy concerns associated
    with language models.'
