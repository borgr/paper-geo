- key: zhang2024unforgettable
  slug: unforgettable-generalization-in-language-models
  title: Unforgettable Generalization in Language Models
  authors:
  - Eric Zhang
  - Leshem Choshen
  - Jacob Andreas
  authors_truncated: null
  year: 2024
  venue: First Conference on Language Modeling
  type: inproceedings
  doi: 10.48550/arXiv.2409.02228
  arxiv: '2409.02228'
  url: null
  abstract: 'When language models (LMs) are trained to forget (or"unlearn'''') a skill, how precisely
    does their behavior change? We study the behavior of transformer LMs in which tasks have been forgotten
    via fine-tuning on randomized labels. Such LMs learn to generate near-random predictions for individual
    examples in the"training''''set used for forgetting. Across tasks, however, LMs exhibit extreme variability
    in whether LM predictions change on examples outside the training set. In some tasks (like entailment
    classification), forgetting generalizes robustly, and causes models to produce uninformative predictions
    on new task instances; in other tasks (like physical commonsense reasoning and scientific question
    answering) forgetting affects only the training examples, and models continue to perform the"forgotten''''task
    accurately even for examples very similar to those that appeared in the training set. Dataset difficulty
    is not predictive of whether a behavior can be forgotten; instead, generalization in forgetting is
    (weakly) predicted by the confidence of LMs''initial task predictions and the variability of LM representations
    of training data, with low confidence and low variability both associated with greater generalization.
    Perhaps most surprisingly, random-label forgetting appears to be somewhat insensitive to the contents
    of the training set: for example, models trained on science questions with random labels continue
    to answer other science questions accurately, but begin to produce random labels on entailment classification
    tasks. Finally, we show that even generalizable forgetting is shallow: linear probes trained on LMs''representations
    can still perform tasks reliably after forgetting. Our results highlight the difficulty and unpredictability
    of performing targeted skill removal from models via fine-tuning.'
