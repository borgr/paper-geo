- key: ashurytahan2025mightytorrbenchmarktable
  slug: the-mighty-torr-a-benchmark-for-table-reasoning-and-robustne
  title: 'The Mighty ToRR: A Benchmark for Table Reasoning and Robustness'
  authors:
  - Shir Ashury-Tahan
  - Yifan Mai
  - Rajmohan C
  - Ariel Gera
  - Yotam Perlitz
  - Asaf Yehudai
  - Elron Bandel
  - Leshem Choshen
  - Eyal Shnarch
  - Percy Liang
  - Michal Shmueli-Scheuer
  authors_truncated: null
  year: 2025
  venue: SurgLLM@ICML
  type: inproceedings
  doi: 10.48550/arXiv.2502.19412
  arxiv: '2502.19412'
  url: https://arxiv.org/abs/2502.19412
  abstract: Despite its real-world significance, model performance on tabular data remains underexplored,
    leaving uncertainty about which model to rely on and which prompt configuration to adopt. To address
    this gap, we create ToRR, a benchmark for Table Reasoning and Robustness, measuring model performance
    and robustness on table-related tasks. The benchmark includes 10 datasets that cover different types
    of table reasoning capabilities across varied domains. ToRR goes beyond model performance rankings,
    and is designed to reflect whether models can handle tabular data consistently and robustly, across
    a variety of common table representation formats. We present a leaderboard as well as comprehensive
    analyses of the results of leading models over ToRR. Our results reveal a striking pattern of brittle
    model behavior, where even strong models are unable to perform robustly on tabular data tasks. Although
    no specific table format leads to consistently better performance, we show that testing over multiple
    formats is crucial for reliably estimating model capabilities. Moreover, we show that the reliability
    boost from testing multiple prompts can be equivalent to adding more test examples. Overall, our findings
    show that table understanding and reasoning tasks remain a significant challenge.
