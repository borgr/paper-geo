- key: DBLP:conf/icml/HacohenCW20
  slug: let-s-agree-to-agree-neural-networks-share-classification-or
  title: 'Let''s Agree to Agree: Neural Networks Share Classification Order on Real Datasets'
  authors:
  - Guy Hacohen
  - Leshem Choshen
  - Daphna Weinshall
  year: 2020
  venue: Proceedings of the 37th International Conference on Machine Learning, {ICML} 2020, 13-18 July
    2020, Virtual Event
  type: inproceedings
  doi: null
  arxiv: '1905.10854'
  url: http://proceedings.mlr.press/v119/hacohen20a.html
  abstract: We report a series of robust empirical observations, demonstrating that deep Neural Networks
    learn the examples in both the training and test sets in a similar order. This phenomenon is observed
    in all the commonly used benchmarks we evaluated, including many image classification benchmarks,
    and one text classification benchmark. While this phenomenon is strongest for models of the same architecture,
    it also crosses architectural boundaries -- models of different architectures start by learning the
    same examples, after which the more powerful model may continue to learn additional examples. We further
    show that this pattern of results reflects the interplay between the way neural networks learn benchmark
    datasets. Thus, when fixing the architecture, we show synthetic datasets where this pattern ceases
    to exist. When fixing the dataset, we show that other learning paradigms may learn the data in a different
    order. We hypothesize that our results reflect how neural networks discover structure in natural datasets.
