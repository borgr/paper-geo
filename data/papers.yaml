- key: DBLP:conf/acl/AbendC18a
  slug: automatic-metric-validation-for-grammatical-error-correction
  title: Automatic Metric Validation for Grammatical Error Correction
  authors:
  - Leshem Choshen
  - Omri Abend
  year: 2018
  venue: 'Proceedings of the 56th Annual Meeting of the Association for Computational Linguistics, {ACL}
    2018, Melbourne, Australia, July 15-20, 2018, Volume 1: Long Papers'
  type: inproceedings
  doi: 10.18653/V1/P18-1127
  arxiv: '1804.11225'
  url: https://aclanthology.org/P18-1127/
  abstract: Metric validation in Grammatical Error Correction (GEC) is currently done by observing the
    correlation between human and metric-induced rankings. However, such correlation studies are costly,
    methodologically troublesome, and suffer from low inter-rater agreement. We propose MAEGE, an automatic
    methodology for GEC metric validation, that overcomes many of the difficulties in the existing methodology.
    Experiments with MAEGE shed a new light on metric quality, showing for example that the standard M^2
    metric fares poorly on corpus-level ranking. Moreover, we use MAEGE to perform a detailed analysis
    of metric behavior, showing that some types of valid edits are consistently penalized by existing
    metrics.
