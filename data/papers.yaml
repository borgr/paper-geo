  authors_truncated: null
  year: 2026
  venue: arXiv preprint arXiv:2604.12843
  type: article
  doi: null
  arxiv: '2604.12843'
  url: null
  abstract: 'The rapid release of both language models and benchmarks makes it increasingly costly to
    evaluate every model on every dataset. In practice, models are often evaluated on different samples,
    making scores difficult to compare across studies. To address this, we propose a framework based on
    multidimensional Item Response Theory (IRT) that uses anchor items to calibrate new benchmarks to
    the evaluation suite while holding previously calibrated item parameters fixed. Our approach supports
    a realistic evaluation setting in which datasets are introduced over time and models are evaluated
    only on the datasets available at the time of evaluation, while a fixed anchor set for each dataset
    is used so that results from different evaluation periods can be compared directly. In large-scale
    experiments on more than 400 models, our framework predicts full-evaluation performance within 2-3
    percentage points using only 100 anchor questions per dataset, with Spearman $ρ\geq 0.9$ for ranking
    preservation preservation. This shows that benchmark suites can grow over time while preserving score
    comparability, since adding a new dataset requires running existing models only on that dataset''s
    anchors. Code and data are available at: https://eliyahabba.github.io/growing-pains/'
  bibtex: "@article{habba2026growing,\n  title={Growing Pains: Extensible and Efficient LLM Benchmarking\
