- key: yadav2024survey
  slug: a-survey-on-model-moerging-recycling-and-routing-among-speci
  title: 'A Survey on Model MoErging: Recycling and Routing Among Specialized Experts for Collaborative
    Learning'
  authors:
  - Prateek Yadav
  - Colin Raffel
  - Mohammed Muqeeth
  - Lucas Caccia
  - Haokun Liu
  - Tianlong Chen
  - Mohit Bansal
  - Leshem Choshen
  - Alessandro Sordoni
  year: 2025
  venue: Transactions on Machine Learning Research
  type: article
  doi: 10.48550/arXiv.2408.07057
  arxiv: '2408.07057'
  url: https://openreview.net/forum?id=u0azVc9Y0y
  abstract: The availability of performant pre-trained models has led to a proliferation of fine-tuned
    expert models that are specialized to a particular domain or task. Model MoErging methods aim to recycle
    expert models to create an aggregate system with improved performance or generalization. A key component
    of MoErging methods is the creation of a router that decides which expert model(s) to use for a particular
    input or application. The promise, effectiveness, and large design space of MoErging has spurred the
    development of many new methods over the past few years. This rapid pace of development has made it
    challenging to compare different MoErging methods, which are rarely compared to one another and are
    often validated in different experimental setups. To remedy such gaps, we present a comprehensive
    survey of MoErging methods that includes a novel taxonomy for cataloging key design choices and clarifying
    suitable applications for each method. Apart from surveying MoErging research, we inventory software
    tools and applications that make use of MoErging. We additionally discuss related fields of study
    such as model merging, multitask learning, and mixture-of-experts models. Taken as a whole, our survey
    provides a unified overview of existing MoErging methods and creates a solid foundation for future
    work in this burgeoning field.
