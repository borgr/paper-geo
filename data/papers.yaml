  abstract: The goal of the BabyLM is to stimulate new research connections between cognitive modeling
    and language model pretraining. We invite contributions in this vein to the BabyLM Workshop, which
    will also include the 4th iteration of the BabyLM Challenge. As in previous years, the challenge features
    two ``standard''tracks (Strict and Strict-Small), in which participants must train language models
    on under 100M or 10M words of data, respectively. This year, we move beyond our previous English-only
    pretraining datasets with a new Multilingual track, focusing on English, Dutch, and Chinese. For the
    workshop, we call for papers related to the overall theme of BabyLM, which includes training efficiency,
    small-scale training datasets, cognitive modeling, model evaluation, and architecture innovation.
