  title: '{DOVE}: A Large-Scale Multi-Dimensional Predictions Dataset Towards Meaningful {LLM} Evaluation'
  authors:
  - Eliya Habba
  - Ofir Arviv
  - Itay Itzhak
  - Yotam Perlitz
  - Elron Bandel
  - Leshem Choshen
  - Michal Shmueli-Scheuer
