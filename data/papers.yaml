- key: huang2026llmsbenefitwords
  slug: do-llms-benefit-from-their-own-words
  title: Do LLMs Benefit From Their Own Words?
  authors:
  - Jenny Y. Huang
  - Leshem Choshen
  - Ramon Astudillo
  - Tamara Broderick
  - Jacob Andreas
  authors_truncated: null
  year: 2026
  venue: null
  type: misc
  doi: 10.48550/arXiv.2602.24287
  arxiv: '2602.24287'
  url: https://arxiv.org/abs/2602.24287
  abstract: 'In multi-turn conversations, large language models typically condition on the full conversation
    history: both past user prompts and assistant responses. We revisit this design choice by comparing
    full-context prompting to four alternative, substantially-reduced context configurations. Analyzing
    in-the-wild multi-turn conversations across three open reasoning and one state-of-the-art model, we
    find that response quality is largely preserved under aggressive context filtering: replacing all
    prior assistant turns with one-sentence summaries or keeping only the most recent user--assistant
    exchange often matches storing full context in performance while using roughly 8x less context. To
    understand this result, we observe that a substantial fraction of user turns (36.4%) in multi-turn
    conversations are self-contained and that many follow-up turns can be addressed by seeing only the
    immediately preceding user--assistant exchange. Furthermore, we find that when models condition on
    their own past responses, this can lead to context pollution, a phenomenon in which reasoning errors,
    hallucinations, or stylistic artifacts propagate across turns. Motivated by these findings, we design
    a context-filtering approach that selectively omits the assistant-side history. Taken together, these
    findings suggest moving away from storing full dialogue transcripts and instead retaining only what
    is relevant.'
