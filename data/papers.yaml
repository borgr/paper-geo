  url: https://arxiv.org/abs/2602.16763
  abstract: Artificial intelligence benchmarks are an important mechanism for measuring model progress
    and guiding deployment decisions. However, benchmarks quickly"saturate", making it difficult to differentiate
    models and diminishing their long-term value. In this study, we define benchmark saturation and analyze
    it across 60 language model benchmarks using 14 properties that relate to saturation. We find that
    nearly half of the our benchmarks exhibit saturation, with rates increasing with age. Further, we
    find that resilience to saturation is impacted by expert-curation, not by public test data. Our results
    suggest that design choices can extend benchmark longevity and inform more durable evaluation approaches.
