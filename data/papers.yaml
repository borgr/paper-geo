  slug: the-language-of-legal-and-illegal-activity-on-the-darknet
  title: The Language of Legal and Illegal Activity on the Darknet
  authors:
  - Leshem Choshen
  - Dan Eldad
  - Daniel Hershcovich
  - Elior Sulem
  - Omri Abend
  year: 2019
  venue: 'Proceedings of the 57th Conference of the Association for Computational Linguistics, {ACL} 2019,
    Florence, Italy, July 28- August 2, 2019, Volume 1: Long Papers'
  type: inproceedings
  doi: 10.18653/V1/P19-1419
  arxiv: '1905.05543'
  url: https://doi.org/10.18653/v1/p19-1419
  abstract: The non-indexed parts of the Internet (the Darknet) have become a haven for both legal and
    illegal anonymous activity. Given the magnitude of these networks, scalably monitoring their activity
    necessarily relies on automated tools, and notably on NLP tools. However, little is known about what
    characteristics texts communicated through the Darknet have, and how well do off-the-shelf NLP tools
    do on this domain. This paper tackles this gap and performs an in-depth investigation of the characteristics
    of legal and illegal text in the Darknet, comparing it to a clear net website with similar content
    as a control condition. Taking drugs-related websites as a test case, we find that texts for selling
    legal and illegal drugs have several linguistic characteristics that distinguish them from one another,
    as well as from the control condition, among them the distribution of POS tags, and the coverage of
    their named entities in Wikipedia.
