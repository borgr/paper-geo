  abstract: 'BabyLM aims to dissolve the boundaries between cognitive modeling and language modeling.
    We call for both workshop papers and for researchers to join the 3rd BabyLM competition. As in previous
    years, we call for participants in the data-efficient pretraining challenge in the general track.
    This year, we also offer a new track: INTERACTION. This new track encourages interactive behavior,
    learning from a teacher, and adapting the teaching material to the student. We also call for papers
    outside the competition in any relevant areas. These include training efficiency, cognitively plausible
    research, weak model evaluation, and more.'
