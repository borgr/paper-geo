note: People `scripts/wikidata_people.py --apply` created, ORCID -> QID. A receipt, not a decision. Wikidata's
  query service lags hours behind an edit, so for those hours this file is the only thing that knows the
  item exists -- without it a second run creates the person twice, and a duplicate human item is the one
  mistake here somebody else has to clean up. Never edit by hand.
