# Human decisions that must survive every rerun.
#
# The collector re-derives everything from live sources each time it runs, so any
# judgment call made by hand has to live here or it gets silently undone on the
# next run. This is the only hand-edited file the collector reads.

# Titles the collector flagged as `similar_but_distinct` that are in fact ONE
# paper. Each group is merged into a single record. The first title listed wins
# for display; the rest contribute their ids, abstracts, and citation counts.
#
# The collector deliberately refuses to auto-merge these: the guard that keeps
# "BabyLM Turns 3" and "BabyLM Turns 4" apart also blocks LaTeX-mangled variants
# and subtitle-prefix pairs. Flagging and deciding here is the intended workflow.
force_merge:
  - - "Q\\({}^{\\mbox{2}}\\): Evaluating Factual Consistency in Knowledge-Grounded Dialogues via Question Generation and Question Answering"
    - "{ extdollar}Q2{ extdollar}: Evaluating Factual Consistency in Knowledge-Grounded Dialogues via Question Generation and Question Answering"
  # A retitle between arXiv v1 and the ICML camera-ready. arxiv.org/abs/1905.10854v1
  # gives "All Neural Networks are Created Equal" as its citation_title, so the two
  # are one paper -- but the v1-titled record reaches us from Semantic Scholar with no
  # arXiv id and no DOI, so the identifier pass has nothing to match on and the titles
  # share almost no words. Left alone it was a 32-word page with 1 citation next to the
  # real page's 64, which is the split-authority failure this file exists to stop.
  - - "Let's Agree to Agree: Neural Networks Share Classification Order on Real Datasets"
    - "All Neural Networks are Created Equal"
  - - "Genie: Achieving Human Parity in Content-Grounded Datasets Generation"
    - "Achieving Human Parity in Content-Grounded Datasets Generation"
  - - "The Mighty ToRR: A Benchmark for Table Reasoning and Robustness"
    - "The Mighty ToRR: A Benchmark for Table Reasoning and Robustness in LLMs"
  # Another v1 retitle: arXiv v2 dropped the word "Physical", and the arXiv API, the
  # abs page's citation_title, DataCite and OpenAlex all now give the shorter form --
  # only Semantic Scholar still carries v1, and it carries most of the citations. The
  # identifier pass merges the pair on its own (the S2 record spells its arXiv id as a
  # DataCite DOI; see `unfold_arxiv_dois`), so this group is here for the *title*: the
  # survivor is otherwise chosen by venue length, which would publish the retracted
  # wording under a slug naming a word the paper no longer contains.
  - - "Global PIQA: Evaluating Commonsense Reasoning Across 100+ Languages and Cultures"
    - "Global PIQA: Evaluating Physical Commonsense Reasoning Across 100+ Languages and Cultures"
  # One paper, two records with the halves of the title swapped around the colon, which
  # is the arrangement the word-overlap guard is least able to see: "Tie the KnOTS:
  # Model Merging with SVD" (ICLR 2025, from the bibliography, no arXiv id, no DOI, 0
  # citations) and "Model merging with SVD to tie the Knots" (arXiv 2410.19735, 112
  # citations). Same five authors in both, with given and family names in opposite
  # order, so the author check cannot break the tie either. The surviving title is the
  # arXiv one because that is what arXiv still serves today -- worth rechecking when the
  # ICLR camera-ready lands, since `KnOTS` is the name the method is cited by.
  - - "Model merging with SVD to tie the Knots"
    - "Tie the KnOTS: Model Merging with SVD"
  # A third arXiv-to-camera-ready retitle, and the one that cost the most: arXiv
  # 2101.12640 is served today as "Enhancing the Transformer Decoder with
  # Transition-based Syntax" (CoNLL 2022, DOI 10.18653/v1/2022.conll-1.27), but
  # Semantic Scholar still keeps the v1 title as a separate record -- with no arXiv id,
  # no DOI, and 8 of the work's 9 citations. Nothing in the identifier pass could join
  # them, and the titles share one word. The visible costs were all downstream: the
  # audit reported the v1 title as missing from ORCID when ORCID has it as an alternate
  # source on the merged work; the worklist asked for a PDF for a paper that is on arXiv
  # under the other title; and the site would have published a 1-citation page next to
  # an 8-citation one for the same paper. ORCID's own record is the tell -- both titles
  # appear there as two sources of one work, with the CoNLL one preferred.
  - - "Enhancing the Transformer Decoder with Transition-based Syntax"
    - "Transition based Graph Decoder for Neural Machine Translation"

# Title pairs that look near-identical but are genuinely different papers.
# Listing them here suppresses the `similar_but_distinct` flag so the review
# queue stays short across reruns.
force_distinct:
  - - "Findings of the {B}aby{LM} Challenge: Sample-Efficient Pretraining on Developmentally Plausible Corpora"
    - "Findings of the Second {B}aby{LM} Challenge: Sample-Efficient Pretraining on Developmentally Plausible Corpora"
  - - "Call for Papers - The BabyLM Challenge: Sample-efficient pretraining on a developmentally plausible corpus"
    - "[Call for Papers] The 2nd BabyLM Challenge: Sample-efficient pretraining on a developmentally plausible corpus"

# Papers that ARE yours even though no form of your name appears in the author list
# the sources give us. The collector excludes those by default, because the
# bibliography it reads is a CV bibliography and also contains the works the CV
# *cites* -- and publishing a canonical page, or an ORCID authorship claim, for
# someone else's paper is far more expensive to undo than a missing page is to add.
#
# List a title here only when the exclusion is a metadata failure rather than the
# truth: a truncated author list, a consortium or shared-task report credited to a
# group, a source that lost your name. Everything listed is kept verbatim, so this
# is also the record of *why* -- keep the comment next to the entry.
#
# `build/not_mine.json` is the current exclusion list, rewritten every run.
also_mine: []

# Papers to add by bare arXiv id, because the bibliography has not caught up yet.
#
# The bibliography stays the source of truth, and the real fix for each of these is
# one entry added upstream in `borgr/publications/enhanced.bib` -- then delete the id
# from here. This list only covers the interval, because until it lands the paper has
# no page at all: nothing to cite, nothing in the sitemap, nothing on the home page.
#
# You do not have to hunt for candidates. `audit_identity.py` diffs arXiv's authority
# records (papers arXiv agrees you *own*) against this corpus and reports the
# difference as `arxiv_stray` -- a paper appearing there is either a bibliography gap
# to fix upstream, or an ownership claim on a paper that is not yours to withdraw.
# Quote the ids. Unquoted, `2604.12843` is a YAML float, and the digits after the
# decimal point are silently reformatted.
#
# Empty because it worked: `2604.12843` sat here until the entry landed upstream, and the
# corpus now gets that paper from the bibliography with its published citation key. The
# worklist reports a line here as redundant once its paper arrives, so the next one does
# not have to be noticed in scrollback.
extra_arxiv: []

# Papers to add by title from OpenReview, for the ones no identifier can name.
#
# `extra_arxiv` above is keyed by arXiv id, which assumes the paper was preprinted. A
# workshop paper usually was not, and no publisher registered a DOI for it either -- so
# there is no identifier to list, and the paper is invisible to every check in this repo
# that starts from one. The site the workshop ran on is what is left.
#
# Titles rather than forum ids, which would be the better key: OpenReview's `notes`
# endpoint answers 403 without a token and only `notes/search` is open, so a title is the
# only handle an unauthenticated run has. Nothing here is typed by hand -- the record is
# fetched every run, so it cannot drift from what OpenReview says -- and a submission that
# was withdrawn, rejected, or is still under review is refused rather than published.
#
# Same lifetime as the list above: it covers the interval until the entry lands upstream,
# and WORKLIST.md counts what is still waiting. `python update.py --step collect` says
# "the bibliography has ... now" once the paste lands, which is when the line goes.
# Spent 2026-08-20: orig.bib has carried polo2025statistical since 2026-08-17, and the
# collect run says so ("the bibliography has it now -- delete that line"). Kept as an
# empty key rather than deleted, because the next workshop paper with no arXiv id and no
# DOI has the same blind spot and this is where it goes.
extra_openreview: []

# Records to drop entirely: things in the bibliography that are not papers.
#
# Two kinds. First, metadata damage -- "Journal of Memory and Language" is a venue
# name that a source extracted as a paper title, the exact failure mode Google
# Scholar's own docs warn about. Fix those upstream too (Semantic Scholar
# correction), then they stop reappearing.
#
# Second, real CV lines that are not papers: a competition you ran, a workshop you
# organised, a poster whose paper is already in the corpus. Each of these was found
# the same way -- it had no full text, because there is no paper to have full text
# of. Publishing a page per item would put three thin pages next to 112 real ones
# and, in the poster's case, split one result's authority across two URLs. They stay
# on the CV; they do not get a page here.
drop:
  - "Journal of Memory and Language"

  # A competition proposal, not a report of findings. OpenReview TiRQ4Gl4Ir under the
  # NeurIPS 2024 *Competition Track*: the document proposes the competition, and its
  # sections are the website, the tutorial, the FAQ, the rules and the prizes. Everyone
  # who cites it cites "In NeurIPS 2024 Competition Track". The competition's actual
  # results were published separately as a technical report.
  - "{LLM} Merging: Building {LLM}s Efficiently through Merging"

  # A workshop, not a paper: HiLD at ICML 2024 (icml.cc/virtual/2024/workshop/29974),
  # whose own name is "High-dimensional Learning Dynamics 2024: The Emergence of
  # Structure and Reasoning". The bibliography records organising it, which is a real
  # line on a CV and not a thing with claims to cite.
  - "High-dimensional Learning Dynamics 2024: The Emergence of Structure and Reasoning Workshop at ICML24"

  # A poster, and the paper it presents is already here. P1-E-16 in the CogSci 2024
  # program, no DOI, no entry in the eScholarship proceedings, 1 citation -- while the
  # work itself is "Findings of the BabyLM Challenge", which is in this corpus with 232.
  # Keeping both would be the split-authority failure `force_merge` exists to prevent,
  # except that these two really are different documents, so merging them would be
  # wrong as well. Dropping the poster is the honest option. If you would rather have
  # the page, deleting this line is the whole change.
  - "Insights from the first BabyLM Challenge: Training sample-efficient language models on a developmentally plausible corpus"

# Hugging Face paper pages where you have already submitted an authorship claim.
#
# The one fact about HF that cannot be read from outside. The API exposes a `user`
# link on an author only once moderation has granted the claim, so a request you
# submitted an hour ago looks identical to one you never made -- and the worklist then
# lists it again, which reads as "your click did not work". Listing the arXiv id here
# moves the page to *pending* in `tasks/hf_worklist.md` and out of the click list.
#
# This is a record of an action you took, not observed state, which is why it belongs
# in a committed file. Remove an id once the claim shows as granted (the audit will
# then report it as claimed on its own) or if it was refused.
#
# Quote the ids -- unquoted, `2409.02228` is a YAML float.
hf_claim_requested:
  - "2410.10783"   # LiveXiv. Author list misspells you as "Leshem Chosen" -- see
  - "2409.02228"   # Unforgettable Generalization. Same misspelling. Both claims may
                   # bounce until arXiv is fixed: tasks/arxiv_name_fixes.md.

# Per-paper field corrections, keyed by slug. Applied last, over everything the
# collector derived. Use sparingly -- prefer fixing the upstream source so the
# correction propagates to Scholar, S2, and OpenAlex rather than just to us.
fields:
  # The merge above kept the arXiv side's year, so the record read "ICLR 2024" for a
  # paper submitted to arXiv in October 2024 -- a year that cannot be right, and the
  # kind of wrong fact a crawler quotes back at you. OpenReview settles it: submission
  # 13539 to ICLR.cc/2025/Conference, accepted as a poster, camera-ready revision
  # filed. The bibliography entry in the CV also says 2025. Only the year is corrected;
  # `venue_display` is derived from it.
  model-merging-with-svd-to-tie-the-knots:
    year: 2025
  # This one reached us with an empty venue and so rendered as a paper with no venue at
  # all, which is the state indexers treat as "preprint" and rank accordingly. It is a
  # position paper accepted to ICML 2026 -- IBM Research lists it under that venue, and
  # OpenReview CbJpizP0vJ is the review record. The reason it looks venue-less is that
  # its text is on SSRN (abstract 6176178) rather than arXiv, so none of the arXiv-shaped
  # paths that fill this in for every other paper apply. `venue` is given in long form
  # because `short_venue` derives "ICML 2026" from it and the year together; writing
  # "ICML 2026" here directly would hard-code the year in two places.
  #
  # The DOI is SSRN's own, and Crossref has it: `10.2139/ssrn.6176178` returns this exact
  # title with Choshen in the author list, type `posted-content`. A preprint DOI is what
  # the rest of the corpus uses where the venue mints none -- 49 of 113 papers carry an
  # arXiv `10.48550` DOI -- and PMLR mints none for ICML. Without it this paper is one of
  # the two that cannot become a Wikidata item, since `paper_item` requires a resolvable
  # identifier.
  position-agentic-systems-should-be-general:
    venue: "International Conference on Machine Learning"
    url: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=6176178"
    doi: "10.2139/ssrn.6176178"
  # ties-merging-resolving-interference-when-merging-models:
  #   venue: "NeurIPS 2023"

# Where to read a paper's full text, when the live URL no longer holds the version the
# sidecar describes. `scripts/fulltext.py` tries this before its whole chain, so the check
# that every figure in a claim appears in the paper's own text reads the version the claim
# was made from.
#
# Only reach for this when a paper has moved under a sidecar that was right about it. A
# paper that is simply hard to fetch wants `data/fulltext/<slug>.pdf` instead, which is
# gitignored and so invisible to CI, and that is the difference -- this key is committed,
# so CI reads the same text as the desk.
fulltext_source:
  # arXiv 2602.24287 got a v2 on 2026-08-11, nearly twice the size, and it revised the
  # numbers. Three figures this sidecar states are in v1 and not in v2 (25,000 and 51.5
  # and 91.7), and four claims cite sections v2 renumbered. Everything the sidecar says is
  # true of the version it was drafted from, so it is pinned there rather than corrected
  # to a paper nobody has read yet. It is owed a re-draft against v2, which needs a model
  # -- see BACKLOG.md, "Nothing notices when a paper is revised".
  do-llms-benefit-from-their-own-words: "https://arxiv.org/html/2602.24287v1"

  # The six below all come from one event. arXiv finished backfilling its own LaTeXML HTML
  # over the corpus, so `arxiv_html` flipped to true and `links.html` moved off ar5iv onto
  # arxiv.org/html for 41 papers. Same paper, same version, different renderer -- and the
  # official one collapses `Figure 1a/b/c` to a single `Figure 1`, drops appendix subsection
  # numbers from headings, and loses some numbers set in math. Thirty-five of the 41 read the
  # same either way. These six do not, so each is pinned to a source measured to carry the
  # evidence its claims cite.
  llm-hypnosis-exploiting-user-feedback-for-unauthorized-knowl:
    "https://ar5iv.labs.arxiv.org/html/2507.02850"
  pretraining-language-models-for-diachronic-linguistic-change:
    "https://ar5iv.labs.arxiv.org/html/2504.05523"
  a-latent-variable-framework-for-scaling-laws-in-large-langua:
    "https://ar5iv.labs.arxiv.org/html/2512.06553"
  # ar5iv renders about half of this one -- 40,608 characters against the PDF's 75,958 --
  # and the half it drops holds the counts four claims cite.
  the-future-of-open-human-feedback: "https://arxiv.org/pdf/2408.16961"
  # ar5iv is no help here. It used to serve a v1 rendering carrying the heading `D.1
  # Translation Quality`, regenerated against v2, and v2 renumbered that appendix away. The
  # v1 PDF is the only place left that has it.
  global-mmlu-understanding-and-addressing-cultural-and-lingui:
    "https://arxiv.org/pdf/2412.03304v1"
  # A 2018 paper, so nothing revised. Both HTML renderers write the subfigure references as
  # a bare `Figure 1`; the Anthology PDF the sidecar was drafted from writes `Figure 1a`.
  inherent-biases-in-reference-based-evaluation-for-grammatica:
    "https://aclanthology.org/P18-1059.pdf"

# Which existing Wikidata item a co-author turns out to be, where an item carries their
# name and neither side states an ORCID. `scripts/wikidata_people.py` lists the ones it
# cannot answer in `tasks/wikidata_people.md` and acts on whatever is written here:
#
#   0000-0001-2345-6789: Q102070311   # the same person -- their ORCID is added to Q102070311
#   0000-0002-3456-7890: new          # a different person -- a separate item is created
#   0000-0003-4567-8901: no           # not this co-author's ORCID at all -- drop it
#
# Nothing else follows by hand either way. The next run resolves the ORCID to the item and
# writes the `author` statements from it.
#
# `no` is for a namesake's identifier. These ORCIDs come from OpenAlex reading a paper whose
# own metadata carries no author identifiers, so on a common name it can resolve to the
# wrong person -- the worklist prints what each ORCID record states, and a record in an
# unrelated field is one of those. Nothing is created and nothing is written for it.
wikidata_people:
  0000-0001-5522-1351: Q67386311   # Mohit Bansal -- UNC Chapel Hill, confirmed by the author
  # Named by an item that states the same institution their ORCID record does.
  0000-0003-2434-2534: Q102390975  # Carlos Alzate -- KU Leuven PhD
  0000-0003-1971-1606: Q103328754  # Judy Hoffman -- UC Berkeley PhD
  0000-0002-3141-5845: Q125454034  # Jacob Andreas -- MIT
  0000-0002-0190-6459: Q107742361  # Sara Hooker -- Cohere Labs
  0000-0003-0153-6811: Q103330754  # Mikhail Yurochkin -- statistician, MBZUAI
  0000-0002-4083-542X: Q102407752  # Joseph Shtok -- Technion PhD, IBM Haifa
  # The ORCID names an institution and a body of work that are not our co-author's,
  # so it belongs to a namesake and nothing should be written from it.
  0000-0003-1445-3150: no          # Prateek Yadav
  0000-0002-8376-107X: no          # Michelle Lin -- UC San Diego
  0000-0002-0836-2212: no          # Bo Liu -- Shanghai Institute of Applied Physics
  0000-0002-4148-895X: no          # Shashank Srivastava -- Motilal Nehru NIT
  0000-0002-6265-5307: no          # Wei Lin
  0000-0002-4837-8411: no          # Yoon Kim -- University of Seoul, not MIT
  0000-0002-9532-4408: no          # Yu Su -- Renewable Energy Systems, not Ohio State
  0000-0001-5863-4856: no          # Omer Goldman -- Cambridge biochemist of the same name
  # Every same-name item is somebody else, so these four need an item of their own.
  0000-0002-0847-8426: new         # Raj Shah -- Georgia Tech; the four items are non-researchers
  0009-0008-7352-2586: new         # Ran Levy -- Amazon; the one item is a naturalist
  0000-0002-3393-8666: new         # Eli Schwartz -- IBM Haifa; the one item is an SEO author
  0009-0003-3187-3955: new         # Wenting Zhao -- Salesforce; the one item is a biochemist
